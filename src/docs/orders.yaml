paths:
  /api/orders:
    get:
      tags: [Orders]
      summary: Listar pedidos activos
      description: Permite filtrar por estado, prioridad, usuario y texto de búsqueda.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, CONFIRMED, IN_TRANSIT, DELIVERED, CANCELLED]
        - in: query
          name: priority
          schema:
            type: string
            enum: [LOW, NORMAL, HIGH, URGENT]
        - in: query
          name: user
          schema: { type: string }
          description: ObjectId del usuario asociado.
        - in: query
          name: search
          schema: { type: string }
          description: Busca por tracking, descripción o dirección.
      responses:
        '200':
          description: Lista de pedidos obtenida correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'

    post:
      tags: [Orders]
      summary: Crear un pedido
      description: Crea un pedido asociado a un usuario existente y con estado/prioridad válidos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: Pedido creado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  payload:
                    $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Obtener un pedido por id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: ObjectId de MongoDB.
      responses:
        '200':
          description: Pedido encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  payload:
                    $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'

    patch:
      tags: [Orders]
      summary: Actualizar un pedido
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdateRequest'
      responses:
        '200':
          description: Pedido actualizado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  payload:
                    $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'

    delete:
      tags: [Orders]
      summary: Eliminar lógicamente un pedido
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Pedido desactivado correctamente. Sin body.
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
